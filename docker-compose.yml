# English-App — Full stack orchestration
# Reutiliza volumes e network existentes: zero migração de dados.

services:

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: english-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Override pra comunicação interna via hostname dos containers
      # (em vez de 172.17.0.1 ou localhost)
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8000
    ports:
      - "8000:8000"
    volumes:
      - ./audio_cache:/app/audio_cache
      - ./assets:/app/assets:ro
    depends_on:
      postgres:
        condition: service_healthy
      evolution_api:
        condition: service_started
    networks:
      - evolution_default

  postgres:
    image: postgres:15
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: evo_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: evolution
    volumes:
      - evolution_postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - evolution_default
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evo_user -d evolution"]
      interval: 10s
      timeout: 5s
      retries: 5

  evolution_api:
    image: evoapicloud/evolution-api:latest
    container_name: evolution_api
    restart: unless-stopped
    env_file:
      - .env.evolution
    volumes:
      - evolution_evolution_instances:/evolution/instances
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - evolution_default

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "5050:80"
    networks:
      - evolution_default
    depends_on:
      - postgres

volumes:
  evolution_postgres_data:
    external: true
  evolution_evolution_instances:
    external: true

networks:
  evolution_default:
    external: true
